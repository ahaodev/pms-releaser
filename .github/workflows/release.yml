name: Publish to PMS

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    if: vars.PROJECT_NAME != '' && vars.PACKAGE_NAME != ''
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changelog
        id: changelog
        uses: ./actions/changelog
        with:
          version: ${{ github.ref_name }}

      - name: Package source archive
        run: git archive --format=tar.gz --prefix=pms-releaser/ HEAD > pms-releaser-source.tar.gz

      - name: Publish source archive
        uses: ./
        with:
          file_path: './pms-releaser-source.tar.gz'
          version: ${{ github.ref_name }}
          changelog_file: ${{ steps.changelog.outputs.changelog_file }}
          project_name: ${{ vars.PROJECT_NAME }}   # set in repo/org variables
          package_name: ${{ vars.PACKAGE_NAME }}   # set in repo/org variables
          artifact_name: 'pms-releaser-source.tar.gz'
          os: 'linux'
          arch: 'universal'
          access_token: ${{ secrets.ACCESS_TOKEN }}
          release_url: ${{ secrets.RELEASE_URL }}
